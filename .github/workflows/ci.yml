name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scikit-learn scipy pillow matplotlib pyyaml pytest
      - run: python -m py_compile leafguard.py
      - run: pytest -q tests
      - run: python scripts/verify_package.py
